[tool.poetry]
name = "sag-dashboard"
version = "0.1.0"
description = ""
authors = ["bobokrut <egor-evlampiev@mail.ru>"]
readme = "README.md"
packages = [{include = "sag_dashboard"}]

[tool.poetry.dependencies]
python = "^3.11"
asgiref = "^3.8.1"
dash = "^2.17.0"
flask = "^3.0.3"
orjson = "^3.10.3"
pydantic = "^2.7.1"
python-dotenv = "^1.0.1"
requests = "^2.31.0"
uvicorn = "^0.29.0"
flask-login = "^0.6.3"
polars = "^0.20.26"
numpy = "^1.26.4"
python-dateutil = "^2.9.0.post0"
dash-ag-grid = "^31.2.0"


[tool.poetry.group.dev.dependencies]
black = "^23.3.0"
pytest = "^7.3.1"
debugpy = "^1.6.7"
memory-profiler = "^0.61.0"
matplotlib = "^3.7.1"
memray = "^1.7.0"
filprofiler = "^2023.3.1"
isort = "^5.12.0"
ruff = "^0.0.277"


[tool.poetry.group.extra.dependencies]
jsonschema = "^4.17.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
target-version = ["py311"]

[tool.basedpyright]
typeCheckingMode = "basic"
venvPath = "/home/bobokrut/.cache/pypoetry/virtualenvs"
venv = "sag-dashboard-pSCj5UPf-py3.11"
pythonVersion = "3.11"
useLibraryCodeForTypes = true

[tool.pytest.ini_options]
addopts = "-r x"

[tool.ruff]
select = ["E", "F", "T20"]
ignore = ["E402", "E501"]


