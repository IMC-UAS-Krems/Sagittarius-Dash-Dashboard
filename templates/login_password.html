{% extends "center_content.html" %}

{% block content %}
   <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
      <div class="w-full bg-white rounded-lg shadow md:mt-0 sm:max-w-md xl:p-0 ">
          <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
              <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl ">
                  Enter your password
              </h1>
              <p class="text-sm text-gray-600">
                  Logging in as: {{ email }}
              </p>
              <form class="space-y-4 md:space-y-6" action="/login/password" method="POST">
                  <div>
                      <label for="password" class="block mb-2 text-sm font-medium text-gray-900">Password</label>
                      <input type="password" name="password" id="password" placeholder="••••••••" class="bg-gray-50 border border-gray-300 text-gray-900 sm:text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5" required>
                  </div>
                  <button type="submit" class="w-full text-white bg-neutral-900 focus:ring-4 focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">Sign in</button>
                  <a href="/login" class="block text-center text-sm text-gray-500">Back to email input</a>
              </form>
          </div>
      </div>
  </div>
{% endblock %}
