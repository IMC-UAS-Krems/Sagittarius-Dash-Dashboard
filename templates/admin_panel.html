{% extends "center_content.html" %} {% block content %}
<div class="flex flex-col items-center justify-center px-6 py-8 mx-auto">
  <div class="w-full bg-white rounded-lg shadow sm:max-w-2xl xl:p-0">
    <div class="p-6 space-y-6 sm:p-8">
      <h1 class="text-xl font-bold text-gray-900 md:text-2xl">
        User Management
      </h1>
      <table class="w-full text-sm text-left text-gray-500 border">
        <thead class="text-xs text-gray-700 uppercase bg-gray-100">
          <tr>
            <th scope="col" class="px-6 py-3">Email</th>
            <th scope="col" class="px-6 py-3">Role</th>
            <th scope="col" class="px-6 py-3">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for user in users %}
          <tr class="border-t">
            <td class="px-6 py-4">{{ user.email }}</td>
            <td class="px-6 py-4">{{ user.role }}</td>
            <td class="px-6 py-4 space-x-2">
              <a
                href="{{ url_for('auth.reset_password', user_id=user.id) }}"
                class="text-blue-600 hover:underline"
                >Reset</a
              >
              <a
                href="{{ url_for('auth.delete_user', user_id=user.id) }}"
                class="text-red-600 hover:underline"
                >Delete</a
              >
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      <form
        action="{{ url_for('auth.create_user') }}"
        method="POST"
        class="space-y-4 pt-6 border-t"
      >
        <h2 class="text-lg font-semibold text-gray-900">Create New User</h2>
        <div>
          <input
            type="text"
            name="email"
            placeholder="E-mail"
            class="border rounded-lg px-4 py-2 w-full"
            required
          />
        </div>
        <div>
          <select
            name="role"
            class="border rounded-lg px-4 py-2 w-full"
            required
          >
            <option value="user">user</option>
            <option value="admin">admin</option>
          </select>
        </div>
        <button
          type="submit"
          class="w-full text-white bg-neutral-900 font-medium rounded-lg text-sm px-5 py-2.5"
        >
          Add User
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
