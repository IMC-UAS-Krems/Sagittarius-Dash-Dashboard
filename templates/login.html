{% extends "center_content.html" %}

{% block content %}
   <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
      <div class="w-full bg-white rounded-lg shadow md:mt-0 sm:max-w-md xl:p-0 ">
          <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
              <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl ">
                  Enter your e-mail
              </h1>
              <form class="space-y-4 md:space-y-6" action="/login" method="POST">
                  <div>
                      <label for="email" class="block mb-2 text-sm font-medium text-gray-900 ">Your e-mail</label>
                      <input type="text" name="email" id="email" class="bg-gray-50 border border-gray-300 text-gray-900 sm:text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5" placeholder="example@organisation.com" required="">
                  </div>
                  <button type="submit" class="w-full text-white bg-neutral-900 focus:ring-4 focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">Continue</button>
              </form>
          </div>
      </div>
  </div>
{% endblock %}
